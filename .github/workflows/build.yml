name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: go test ./...
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - run: wails build -clean -platform windows/amd64 -o Ascent.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Ascent-windows-amd64
          path: build/bin/Ascent.exe
      - run: wails build -clean -platform windows/arm64 -o Ascent-arm64.exe
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: Ascent-windows-arm64
          path: build/bin/Ascent-arm64.exe
          if-no-files-found: ignore
  macos-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: GOOS=darwin GOARCH=arm64 go build -o Ascent-mac-arm64 .
      - run: GOOS=darwin GOARCH=amd64 go build -o Ascent-mac-intel .
      - uses: actions/upload-artifact@v4
        with:
          name: Ascent-macos-web
          path: Ascent-mac-*
