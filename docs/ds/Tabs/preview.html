<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0}body{display:grid;grid-template-columns:1fr 1fr}
.pane{background:var(--surface-window);color:var(--ink);padding:24px;display:flex;flex-direction:column;gap:16px;align-items:flex-start;min-width:0}
.lbl{font:600 11px/14px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted)}
.rowx{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
</style></head><body>
<div class="pane as-root" data-theme="light"><div class="lbl">Светлая</div><div class="as-tabs" role="tablist"><button class="as-tab is-active" role="tab" aria-selected="true">Сегодня</button><button class="as-tab" role="tab" aria-selected="false">Неделя</button><button class="as-tab" role="tab" aria-selected="false">Всё время</button></div></div>
<div class="pane as-root" data-theme="dark"><div class="lbl">Тёмная</div><div class="as-tabs" role="tablist"><button class="as-tab is-active" role="tab" aria-selected="true">Сегодня</button><button class="as-tab" role="tab" aria-selected="false">Неделя</button><button class="as-tab" role="tab" aria-selected="false">Всё время</button></div></div>
<script>window.Ascent&&Ascent.wire(document)</script></body></html>
